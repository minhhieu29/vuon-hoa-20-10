<!doctype html>
<!--
  Nguồn của ảnh xem trước khi gửi link (public/og-image.png, 1200×630).
  Đổi chữ ở đây rồi chụp lại bằng lệnh trong README (mục "Ảnh xem trước khi gửi link").
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Charm'; font-weight: 700; src: url(../node_modules/@fontsource/charm/files/charm-vietnamese-700-normal.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9; }
  @font-face { font-family: 'Charm'; font-weight: 700; src: url(../node_modules/@fontsource/charm/files/charm-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Playfair'; font-weight: 400 900; src: url(../node_modules/@fontsource-variable/playfair-display/files/playfair-display-vietnamese-wght-normal.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9; }
  @font-face { font-family: 'Playfair'; font-weight: 400 900; src: url(../node_modules/@fontsource-variable/playfair-display/files/playfair-display-latin-wght-normal.woff2) format('woff2'); }
  @font-face { font-family: 'BVP'; font-weight: 600; src: url(../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-600-normal.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9; }
  @font-face { font-family: 'BVP'; font-weight: 600; src: url(../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-600-normal.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #FFF6FB;
    background: radial-gradient(70% 60% at 50% 115%, rgba(255, 95, 162, .38), transparent 70%), radial-gradient(45% 45% at 4% 100%, rgba(198, 156, 255, .3), transparent 70%), radial-gradient(45% 45% at 96% 100%, rgba(255, 138, 128, .26), transparent 70%), linear-gradient(#120B2E, #0B0820); }
  #stars, #garden { position: absolute; inset: 0; }
  .copy { position: absolute; left: 0; right: 0; top: 92px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .eyebrow { font: 600 22px/1 BVP, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #F4A6C0; }
  .to { font: 700 68px/1.15 Charm, cursive; color: #FFD36E; text-shadow: 0 4px 30px rgba(11, 8, 32, .9); }
  .title { font: 700 50px/1.15 Playfair, serif; text-shadow: 0 4px 30px rgba(11, 8, 32, .9); }
  .rule { width: 160px; height: 16px; }
</style>
</head>
<body>
  <svg id="stars" viewBox="0 0 1200 630"></svg>
  <svg id="garden" viewBox="0 0 1200 630"></svg>
  <div class="copy">
    <div class="eyebrow">Ngày Phụ nữ Việt Nam · 20.10</div>
    <div class="to">Gửi những người phụ nữ thân yêu</div>
    <svg class="rule" viewBox="0 0 132 14"><path d="M3 9c14-6 24-6 34 0s20 5 30-1 22-6 32 0 20 5 30-2" fill="none" stroke="#F4A6C0" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div class="title">Một khu vườn nhỏ nở để cảm ơn bạn</div>
  </div>
<script>
  /* sao trời và một hàng hoa dưới đáy: cúc họa mi, sen, hoa hồng, hướng dương (giống các loài trong trang) */
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ring = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join('');
  let stars = '';
  for (let i = 0; i < 140; i++) stars += `<circle cx="${(rnd() * 1200).toFixed(1)}" cy="${(rnd() * 420).toFixed(1)}" r="${(0.4 + rnd() * 1.4).toFixed(2)}" fill="${rnd() < .25 ? '#C69CFF' : '#fff'}" opacity="${(0.25 + rnd() * 0.6).toFixed(2)}"/>`;
  document.getElementById('stars').innerHTML = stars;
  const HEADS = {
    daisy: ring(14, i => `<ellipse cy="-13" rx="3.8" ry="10.5" transform="rotate(${(i * 360 / 14).toFixed(1)})" fill="#FFF7FB"/>`) + '<circle r="7" fill="#FFD36E"/><circle r="4" fill="#FFB648"/>',
    lotus: '<path d="M0 8C-8 2-20-4-24-14c9-1 18 4 24 22z" fill="#E86A9A"/><path d="M0 8C8 2 20-4 24-14c-9-1-18 4-24 22z" fill="#E86A9A"/><path d="M0 8C-10 0-14-14-10-26c6 6 10 18 10 34z" fill="#FF8FB8"/><path d="M0 8C10 0 14-14 10-26c-6 6-10 18-10 34z" fill="#FF8FB8"/><ellipse cy="-15" rx="6.5" ry="2.4" fill="#F5C542"/><path d="M0 8C-7 0-7-18 0-30 7-18 7 0 0 8z" fill="#FFD3E4"/><path d="M0 -12C-3-17-3-24 0-30 3-24 3-17 0-12z" fill="#FF9EC2"/>',
    rose: '<circle r="22" fill="#C42E66"/>' + ring(6, i => `<ellipse cy="-13" rx="11" ry="14" transform="rotate(${i * 60 + 10})" fill="#E2457F"/>`) + ring(5, i => `<ellipse cy="-8" rx="9" ry="10" transform="rotate(${i * 72 + 36})" fill="#FF5FA2"/>`) + '<circle r="9" fill="#FF7DB5"/>',
    sun: ring(16, i => `<ellipse cy="-17" rx="4.4" ry="10" transform="rotate(${i * 22.5})" fill="#F5B82E"/>`) + '<circle r="11" fill="#5E3519"/><circle r="7.5" fill="#7A4622"/>',
  };
  const GLOW = { daisy: '#FFF4F8', lotus: '#FF8FB8', rose: '#FF5FA2', sun: '#FFD36E' };
  const order = ['daisy', 'lotus', 'rose', 'daisy', 'sun', 'lotus', 'daisy', 'rose', 'lotus', 'daisy', 'sun', 'daisy', 'lotus', 'rose', 'daisy'];
  let g = '<defs>' + Object.entries(GLOW).map(([k, c]) => `<radialGradient id="g-${k}"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('') + '</defs>';
  order.forEach((k, i) => {
    const x = 40 + i * (1120 / (order.length - 1)) + (rnd() - 0.5) * 30;
    const edge = Math.abs(x - 600) / 600;
    const h = 70 + edge * 120 + rnd() * 30, y = 630 - h, s = 1.15 + edge * 0.5 + rnd() * 0.2;
    const lean = (rnd() - 0.5) * 30;
    g += `<path d="M${x.toFixed(1)} 640Q${(x + lean * 0.4).toFixed(1)} ${(630 - h * 0.5).toFixed(1)} ${(x + lean).toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round"/>`;
    g += `<ellipse cx="${(x + lean * 0.5 + 12).toFixed(1)}" cy="${(630 - h * 0.45).toFixed(1)}" rx="13" ry="6" transform="rotate(-30 ${(x + lean * 0.5 + 12).toFixed(1)} ${(630 - h * 0.45).toFixed(1)})" fill="#2BC48A"/>`;
    g += `<circle cx="${(x + lean).toFixed(1)}" cy="${y.toFixed(1)}" r="${(60 * s).toFixed(1)}" fill="url(#g-${k})"/>`;
    g += `<g transform="translate(${(x + lean).toFixed(1)} ${y.toFixed(1)}) rotate(${((rnd() - 0.5) * 30).toFixed(1)}) scale(${s.toFixed(2)})">${HEADS[k]}</g>`;
  });
  document.getElementById('garden').innerHTML = g;
</script>
</body>
</html>
